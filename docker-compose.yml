services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: revoo-app

    restart: unless-stopped

    init: true

    ports:
      - "127.0.0.1:3000:3000"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"

    security_opt:
      - no-new-privileges:true